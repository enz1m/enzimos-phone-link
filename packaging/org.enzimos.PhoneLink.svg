<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Phone Link</title>
  <defs>
    <filter id="enz-phonelink-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="enz-phonelink-a">
      <rect x="18" y="24" width="62" height="62" rx="16"/>
    </clipPath>
  </defs>

  <!-- square keyline; tile A 62 x 62 (18..80 x 24..86), tile B 62 x 62 (48..110 x 42..104), radius 16;
       union centred on (64 64); overlap 32 x 44 printed in the deep shade (tile B clipped to tile A) -->
  <g filter="url(#enz-phonelink-drop)">
    <rect x="18" y="24" width="62" height="62" rx="16" fill="#12B886"/>
    <rect x="48" y="42" width="62" height="62" rx="16" fill="#7EE2BE"/>
    <rect x="48" y="42" width="62" height="62" rx="16" fill="#0B7A59" clip-path="url(#enz-phonelink-a)"/>
  </g>
</svg>
