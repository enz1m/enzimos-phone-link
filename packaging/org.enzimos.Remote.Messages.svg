<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Phone Messages</title>
  <defs>
    <filter id="enz-phonemessages-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- portrait keyline; charcoal phone 62 x 98 (33..95 x 15..113), radius 12 (heavy device body), no back sheet;
       screen inset 6, radius 4; two incoming Cloud bubbles and one outgoing bubble in Phone Link mint -->
  <g filter="url(#enz-phonemessages-drop)">
    <rect x="33" y="15" width="62" height="98" rx="12" fill="#2F3238"/>
  </g>
  <rect x="39" y="21" width="50" height="86" rx="4" fill="#FFFFFF"/>
  <rect x="44" y="32" width="32" height="16" rx="8" fill="#E3E8F0"/>
  <rect x="52" y="54" width="32" height="16" rx="8" fill="#12B886"/>
  <rect x="44" y="76" width="26" height="16" rx="8" fill="#E3E8F0"/>
  <rect x="59" y="60" width="18" height="4" rx="2" fill="#FFFFFF"/>
</svg>
