[workspace]
members = ["crates/host-client", "crates/sessiond", "crates/signaling", "crates/webrtc-loopback", "crates/webrtc-ipc", "crates/webrtc-server", "crates/control", "crates/uplink"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
enzui-security = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-core = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-widgets = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
iced = { git = "https://github.com/enz1m/enzim-iced.git", rev = "e36b07b591661fdb666088fc943cc0b927a2367b", default-features = true, features = ["tokio", "a11y", "image-without-codecs"] }
gst-app = { package = "gstreamer-app", version = "0.24.5", features = ["v1_28"] }
gst-video = { package = "gstreamer-video", version = "0.24.5", features = ["v1_28"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gst = { package = "gstreamer", version = "0.24.5", features = ["v1_28"] }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.24.5", features = ["v1_28"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.24.5", features = ["v1_28"] }

[profile.dev]
debug = 0
incremental = true
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 0
debug = 0
incremental = true
[profile.test.package."*"]
opt-level = 2
[profile.release]
lto = false
codegen-units = 16
debug = 0
strip = "none"
incremental = false

# Match the patches at the SDK workspace root.
[patch.crates-io]
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "40eeb41f8637ef1620afa377ba006874224b6d65" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
